<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>Paper grain at night</title>
  <!-- Grain for the night paper: chalk dust over a faint cloudiness. -->
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.95  0 0 0 0 0.92  0 0 0 0 0.87  0 0 0 0.7 -0.34"/>
  </filter>
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.7  0 0 0 0 0.66  0 0 0 0 0.85  0 0 0 0.22 -0.08"/>
  </filter>
  <rect width="240" height="240" filter="url(#cloud)"/>
  <rect width="240" height="240" filter="url(#fine)"/>
</svg>

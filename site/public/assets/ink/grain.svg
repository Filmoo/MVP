<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>Paper grain</title>
  <!-- Paper grain for the day paper: fine ink specks over a faint cloudiness. -->
  <filter id="fine" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.14  0 0 0 0 0.25  0 0 0 0.9 -0.42"/>
  </filter>
  <filter id="cloud" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="8" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0.35 -0.12"/>
  </filter>
  <rect width="240" height="240" filter="url(#cloud)"/>
  <rect width="240" height="240" filter="url(#fine)"/>
</svg>

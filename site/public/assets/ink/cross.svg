<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <title>Brush cross</title>
  <!-- Two brush strokes crossing: the bullet of "what it won't do", used as a CSS mask. -->
  <filter id="r" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="6"/>
    <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#r)" fill="none" stroke="#000" stroke-linecap="round">
    <path d="M9 8 C 16 16 24 25 32 33" stroke-width="5"/>
    <path d="M31 7 C 24 15 16 24 8 33" stroke-width="4.2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 28" preserveAspectRatio="none">
  <title>Brush underline</title>
  <!-- A brush underline, used as a CSS mask (its colour comes from the page). -->
  <filter id="r" x="-2%" y="-60%" width="104%" height="220%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04 0.4" numOctaves="2" seed="11"/>
    <feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <g filter="url(#r)" fill="none" stroke="#000" stroke-linecap="round">
    <path d="M7 16 C 90 9 230 8 393 11" stroke-width="7"/>
    <path d="M46 21 C 150 15 262 15 352 17" stroke-width="3.2" stroke-opacity="0.8"/>
  </g>
</svg>

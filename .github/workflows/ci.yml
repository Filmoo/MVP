name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token: checks never write to the repository. Pull requests from forks run with no
# secrets at all (GitHub's default), and first-time contributors' runs wait for the maintainer.
permissions:
  contents: read

# One run per branch at a time. A running build is never cancelled (it has to finish to save
# its cache); a newer push waits, and replaces any older run still waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Lint · types · unit · Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check.mjs fast

  ui:
    name: UI suites · layout · coherence · errors · perf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @scout/ui exec playwright install --with-deps chromium
      - name: Cache game assets (Data Dragon)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ddragon
          key: ddragon-${{ hashFiles('fixtures/ddragon-version.txt', 'scripts/fetch-dev-assets.mjs') }}
      - run: node scripts/fetch-dev-assets.mjs
      - run: node scripts/check.mjs ui
      - name: Screenshots for review
        if: always()
        run: pnpm --filter @scout/ui screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-reports
          path: |
            ui/playwright-report
            reports/perf
            reports/screenshots
          retention-days: 14

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build (no push)
        run: docker build -f apps/backend/Dockerfile -t mvp-backend:ci .
      - name: Starts and answers /health without a key
        run: |
          docker run -d --name mvp-backend -p 127.0.0.1:8787:8787 mvp-backend:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/health && exit 0; sleep 1; done
          docker logs mvp-backend
          exit 1

  crawler-image:
    name: Crawler Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build (no push)
        run: docker build -f apps/crawler/Dockerfile -t mvp-crawler:ci .
      - name: Runs against an empty store and publishes nothing
        run: |
          docker run --rm -v crawl-ci:/crawl mvp-crawler:ci status
          docker run --rm -v crawl-ci:/crawl -v data-ci:/data mvp-crawler:ci publish --out /data/stats --ddragon off

  windows:
    name: Windows build (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scout/ui build
      # The backend runs on Linux (tested in `checks`, image built in `backend-image`).
      - run: cargo test --workspace --locked --exclude mvp-backend
      # Builds only the desktop crate (tauri runs cargo in apps/desktop), never the backend.
      # The app's server comes from the repository variable (MVP: https://api.mvpgg.com); unset,
      # as in a fork, the build talks to a local backend (http://127.0.0.1:8787).
      - run: pnpm build:exe
        env:
          MVP_BACKEND_URL: ${{ vars.MVP_BACKEND_URL }}
      - name: Footprint of the real app (RAM, idle CPU)
        shell: pwsh
        run: ./scripts/windows-footprint.ps1 -Exe target/release/MVP.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: footprint-windows
          path: reports/footprint.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scout-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/MVP.exe
          if-no-files-found: error
          retention-days: 30

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch at a time. A running build is never cancelled (it has to finish to save
# its cache); a newer push waits, and replaces any older run still waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Lint · types · unit · Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check.mjs fast

  ui:
    name: UI suites · layout · coherence · errors · perf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @scout/ui exec playwright install --with-deps chromium
      - name: Cache game assets (Data Dragon)
        uses: actions/cache@v4
        with:
          path: .cache/ddragon
          key: ddragon-${{ hashFiles('fixtures/ddragon-version.txt') }}
      - run: node scripts/fetch-dev-assets.mjs
      - run: node scripts/check.mjs ui
      - name: Screenshots for review
        if: always()
        run: pnpm --filter @scout/ui screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: |
            ui/playwright-report
            reports/perf
            reports/screenshots
          retention-days: 14

  windows:
    name: Windows build (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scout/ui build
      - run: cargo test --workspace --locked
      - run: pnpm build:exe
      - name: Footprint of the real app (RAM, idle CPU)
        shell: pwsh
        run: ./scripts/windows-footprint.ps1 -Exe target/release/Scout.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-windows
          path: reports/footprint.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scout-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/Scout.exe
          if-no-files-found: error
          retention-days: 30

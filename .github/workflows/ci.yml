name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# One run per branch at a time. A running build is never cancelled (it has to finish to save
# its cache); a newer push waits, and replaces any older run still waiting.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Lint · types · unit · Rust tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check.mjs fast

  ui:
    name: UI suites · layout · coherence · errors · perf
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @scout/ui exec playwright install --with-deps chromium
      - name: Cache game assets (Data Dragon)
        uses: actions/cache@v4
        with:
          path: .cache/ddragon
          key: ddragon-${{ hashFiles('fixtures/ddragon-version.txt', 'scripts/fetch-dev-assets.mjs') }}
      - run: node scripts/fetch-dev-assets.mjs
      - run: node scripts/check.mjs ui
      - name: Screenshots for review
        if: always()
        run: pnpm --filter @scout/ui screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: |
            ui/playwright-report
            reports/perf
            reports/screenshots
          retention-days: 14

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push)
        run: docker build -f apps/backend/Dockerfile -t mvp-backend:ci .
      - name: Starts and answers /health without a key
        run: |
          docker run -d --name mvp-backend -p 127.0.0.1:8787:8787 mvp-backend:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8787/health && exit 0; sleep 1; done
          docker logs mvp-backend
          exit 1

  roadmap:
    name: Roadmap (dev.mvpgg.com) · UI against the service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Chromium for Playwright
        run: pnpm --filter @scout/roadmap exec playwright install --with-deps chromium
      - run: node scripts/check.mjs roadmap
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: roadmap-test-results
          path: apps/roadmap/web/test-results
          retention-days: 14

  roadmap-image:
    name: Roadmap Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push)
        run: docker build -f apps/roadmap/Dockerfile -t mvp-roadmap:ci .
      - name: Refuses to start without its secrets, answers /health with them
        run: |
          if docker run --rm mvp-roadmap:ci serve; then echo "started without secrets"; exit 1; fi
          docker run -d --name mvp-roadmap -p 127.0.0.1:8790:8790 \
            -e ROADMAP_PUBLIC_URL=https://dev.mvpgg.com -e ROADMAP_GITHUB_CLIENT_ID=ci \
            -e ROADMAP_GITHUB_CLIENT_SECRET=ci -e ROADMAP_SESSION_KEY="$(openssl rand -hex 32)" mvp-roadmap:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8790/health; then
              curl -fsS http://127.0.0.1:8790/ | grep -q '<div id="root">' && exit 0
            fi
            sleep 1
          done
          docker logs mvp-roadmap
          exit 1

  crawler-image:
    name: Crawler Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build (no push)
        run: docker build -f apps/crawler/Dockerfile -t mvp-crawler:ci .
      - name: Runs against an empty store and publishes nothing
        run: |
          docker run --rm -v crawl-ci:/crawl mvp-crawler:ci status
          docker run --rm -v crawl-ci:/crawl -v data-ci:/data mvp-crawler:ci publish --out /data/stats --ddragon off

  windows:
    name: Windows build (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scout/ui build
      # The backend runs on Linux (tested in `checks`, image built in `backend-image`).
      - run: cargo test --workspace --locked --exclude mvp-backend
      # Builds only the desktop crate (tauri runs cargo in apps/desktop), never the backend.
      - run: pnpm build:exe
      - name: Footprint of the real app (RAM, idle CPU)
        shell: pwsh
        run: ./scripts/windows-footprint.ps1 -Exe target/release/MVP.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: footprint-windows
          path: reports/footprint.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: scout-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/MVP.exe
          if-no-files-found: error
          retention-days: 30

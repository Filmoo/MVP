// MVP server: also update Docker, and reboot at 04:00 UTC when an update needs it.
// /etc/apt/apt.conf.d/52mvp-unattended-upgrades (Ubuntu's security updates are on by default).
Unattended-Upgrade::Origins-Pattern { "origin=Docker"; };
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-Time "04:00";

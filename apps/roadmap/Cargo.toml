[package]
name = "mvp-roadmap"
description = "MVP's private roadmap (dev.mvpgg.com): features by version, Claude's proposals, an audit log. Only the repository's admins sign in (GitHub); Claude uses a machine token."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mvp_roadmap"

[[bin]]
name = "mvp-roadmap"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["matched-path", "query"] }
base64.workspace = true
form_urlencoded.workspace = true
reqwest.workspace = true
ring.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true

[lints]
workspace = true

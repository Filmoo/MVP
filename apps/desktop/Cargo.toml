[package]
name = "scout-desktop"
description = "Desktop shell: Tauri window, tray and the bridge between the Rust core and the UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "scout_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
companion.workspace = true
domain.workspace = true
lcu.workspace = true
# Banner links in the default browser (ShellExecute on Windows, no shell in between).
open = { version = "5", features = ["shellexecute-on-windows"] }
static-data.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# rustls only (no system proxy crates, no zip: releases ship the NSIS installer itself).
tauri-plugin-updater = { version = "2.13", default-features = false, features = ["rustls-tls"] }
tracing.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
scrub.workspace = true

[lints]
workspace = true

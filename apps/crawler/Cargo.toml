[package]
name = "mvp-crawler"
description = "Stats crawler and publisher: Riot API (server-side key) → Emerald+ matches in SQLite → per-patch JSON aggregates served by mvp-backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mvp_crawler"

[[bin]]
name = "mvp-crawler"
path = "src/main.rs"

[dependencies]
aggregate.workspace = true
domain.workspace = true
futures-util.workspace = true
riot-api.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
static-data.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
axum.workspace = true
mvp-backend = { path = "../backend" }
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[package]
name = "mvp-backend"
description = "Backend HTTP service for the desktop app: player lookups, loading-screen scouting, app updates, remote config and opt-in crash reports. The Riot API key lives only here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mvp_backend"

[[bin]]
name = "mvp-backend"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["matched-path", "query"] }
domain.workspace = true
futures-util.workspace = true
players.workspace = true
static-data.workspace = true
regex.workspace = true
riot-api.workspace = true
scrub.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
reqwest.workspace = true
rustls.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

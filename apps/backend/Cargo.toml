[package]
name = "mvp-backend"
description = "Backend HTTP service for the desktop app: player lookups and loading-screen scouting via the Riot API. The Riot API key lives only here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "mvp_backend"

[[bin]]
name = "mvp-backend"
path = "src/main.rs"

[dependencies]
axum.workspace = true
domain.workspace = true
futures-util.workspace = true
players.workspace = true
riot-api.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "signal"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
